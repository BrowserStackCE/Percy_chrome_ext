name: Percy Local Manager — Tests & Release

on:
  push:
  pull_request:

jobs:
  # ============================================================
  # Job 1: Run all tests
  # ============================================================
  test:
    name: API, E2E & Extension UI Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go backend
        working-directory: go-backend
        run: go build -o server ./cmd/server

      - name: Start Go backend
        working-directory: go-backend
        run: |
          ./server &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4321/health > /dev/null; then
              echo "Backend is up"
              break
            fi
            echo "Waiting for backend... ($i)"
            sleep 1
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install chromium --with-deps

      - name: Install extension dependencies and start Vite dev server
        working-directory: percy-local-manager-extension
        run: |
          npm ci --legacy-peer-deps
          npm run dev &
          echo "VITE_PID=$!" >> $GITHUB_ENV
          # Wait for Vite to be ready
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Vite dev server is up"
              break
            fi
            echo "Waiting for Vite... ($i)"
            sleep 1
          done

      - name: Run API tests
        working-directory: tests
        env:
          BACKEND_URL: http://localhost:4321
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_READ_TOKEN: ${{ secrets.PERCY_READ_TOKEN }}
        run: npm run test:api

      - name: Run E2E tests
        working-directory: tests
        env:
          BACKEND_URL: http://localhost:4321
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_READ_TOKEN: ${{ secrets.PERCY_READ_TOKEN }}
        run: npm run test:e2e

      - name: Run Extension UI tests
        working-directory: tests
        env:
          BACKEND_URL: http://localhost:4321
          EXTENSION_DEV_URL: http://localhost:5173
        run: npm run test:extension-ui

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14

      - name: Stop Go backend and Vite dev server
        if: always()
        run: |
          kill $SERVER_PID || true
          kill $VITE_PID || true

  # ============================================================
  # Job 2: BrowserStack Automate — OS X only (tests/browserstack.macos.yml)
  # Job 3: BrowserStack Automate — Windows only (tests/browserstack.windows.yml)
  #
  # The Go backend is shared state: ONE snapshot queue and ONE build slot (a
  # second finalize returns 409), and the BrowserStack SDK runs every platform
  # of one invocation at the same time. So each platform gets its own job: own
  # runner, own backend + Vite server, own single-platform config. The two jobs
  # run simultaneously, which keeps the total build time down.
  # ============================================================
  test-browserstack-macos:
    name: BrowserStack Automate (OS X)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Both platform jobs derive the SAME build number from the workflow run
      # (run_number + run_attempt), so OS X and Windows report into ONE build.
      - name: Generate build number and write it to browserstack.macos.yml
        working-directory: tests
        run: |
          BUILD_NUMBER="${{ github.run_number }}.${{ github.run_attempt }}"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          sed -i "s|^buildIdentifier:.*|buildIdentifier: '#${BUILD_NUMBER}'|" browserstack.macos.yml
          grep -n '^buildName\|^buildIdentifier' browserstack.macos.yml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go backend
        working-directory: go-backend
        run: go build -o server ./cmd/server

      - name: Start Go backend
        working-directory: go-backend
        run: |
          ./server &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4321/health > /dev/null; then
              echo "Backend is up"
              break
            fi
            echo "Waiting for backend... ($i)"
            sleep 1
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install extension dependencies and start Vite dev server
        working-directory: percy-local-manager-extension
        run: |
          npm ci --legacy-peer-deps
          npm run dev &
          echo "VITE_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Vite dev server is up"
              break
            fi
            echo "Waiting for Vite... ($i)"
            sleep 1
          done

      - name: Run all tests on BrowserStack — OS X (API + E2E + Extension UI)
        working-directory: tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BACKEND_URL: http://localhost:4321
          EXTENSION_DEV_URL: http://localhost:5173
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_READ_TOKEN: ${{ secrets.PERCY_READ_TOKEN }}
        run: npx browserstack-node-sdk playwright test --workers=1 --browserstack.config=browserstack.macos.yml

      - name: Fetch BrowserStack build public URL
        if: always()
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          BUILD_URL=$(curl -s -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            "https://api.browserstack.com/automate/builds.json?limit=1" \
            | python3 -c "import sys,json; b=json.load(sys.stdin)[0]['automation_build']; print(b.get('public_url') or 'https://automate.browserstack.com/builds/' + b['hashed_id'])")
          echo "BrowserStack Build URL: $BUILD_URL"
          echo "BROWSERSTACK_BUILD_URL=$BUILD_URL" >> $GITHUB_ENV

      - name: Upload BrowserStack Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-playwright-report-macos
          path: tests/playwright-report/
          retention-days: 14

      - name: Stop Go backend and Vite dev server
        if: always()
        run: |
          kill $SERVER_PID || true
          kill $VITE_PID || true

  test-browserstack-windows:
    name: BrowserStack Automate (Windows)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same derivation as the OS X job, so both land in the same build.
      - name: Generate build number and write it to browserstack.windows.yml
        working-directory: tests
        run: |
          BUILD_NUMBER="${{ github.run_number }}.${{ github.run_attempt }}"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          sed -i "s|^buildIdentifier:.*|buildIdentifier: '#${BUILD_NUMBER}'|" browserstack.windows.yml
          grep -n '^buildName\|^buildIdentifier' browserstack.windows.yml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go backend
        working-directory: go-backend
        run: go build -o server ./cmd/server

      - name: Start Go backend
        working-directory: go-backend
        run: |
          ./server &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4321/health > /dev/null; then
              echo "Backend is up"
              break
            fi
            echo "Waiting for backend... ($i)"
            sleep 1
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install extension dependencies and start Vite dev server
        working-directory: percy-local-manager-extension
        run: |
          npm ci --legacy-peer-deps
          npm run dev &
          echo "VITE_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Vite dev server is up"
              break
            fi
            echo "Waiting for Vite... ($i)"
            sleep 1
          done

      - name: Run all tests on BrowserStack — Windows (API + E2E + Extension UI)
        working-directory: tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BACKEND_URL: http://localhost:4321
          EXTENSION_DEV_URL: http://localhost:5173
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_READ_TOKEN: ${{ secrets.PERCY_READ_TOKEN }}
        run: npx browserstack-node-sdk playwright test --workers=1 --browserstack.config=browserstack.windows.yml

      - name: Fetch BrowserStack build public URL
        if: always()
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          BUILD_URL=$(curl -s -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            "https://api.browserstack.com/automate/builds.json?limit=1" \
            | python3 -c "import sys,json; b=json.load(sys.stdin)[0]['automation_build']; print(b.get('public_url') or 'https://automate.browserstack.com/builds/' + b['hashed_id'])")
          echo "BrowserStack Build URL: $BUILD_URL"
          echo "BROWSERSTACK_BUILD_URL=$BUILD_URL" >> $GITHUB_ENV

      - name: Upload BrowserStack Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-playwright-report-windows
          path: tests/playwright-report/
          retention-days: 14

      - name: Stop Go backend and Vite dev server
        if: always()
        run: |
          kill $SERVER_PID || true
          kill $VITE_PID || true
