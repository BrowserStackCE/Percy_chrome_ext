name: Build and Release Percy Local Manager

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build distributables
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ------------------------------------------------------
      # Setup Go
      # ------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      # ------------------------------------------------------
      # Setup Node
      # ------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # ------------------------------------------------------
      # Make build script executable & Build
      # ------------------------------------------------------
      - name: Make build script executable
        run: chmod +x build-distributables.sh

      - name: Build distributables
        run: ./build-distributables.sh

      # ------------------------------------------------------
      # Verify output
      # ------------------------------------------------------
      - name: Verify distributables
        run: |
          echo "=========================================="
          echo "Checking distributables"
          echo "=========================================="

          find Distributables -maxdepth 3 -type f | sort

          echo
          echo "Checking Linux..."
          test -f Distributables/percy-linux/server
          test -f Distributables/percy-linux/server.sh
          test -f Distributables/percy-linux/Instruction.md

          echo
          echo "Checking Mac..."
          test -f Distributables/percy-mac/server
          test -f Distributables/percy-mac/server-arm64
          test -f Distributables/percy-mac/server.sh
          test -f Distributables/percy-mac/Instructions.md

          echo
          echo "Checking Windows..."
          test -f Distributables/percy-windows/server.exe
          test -f Distributables/percy-windows/server.bat
          test -f Distributables/percy-windows/Instructions.md

          echo
          echo "Checking Extension..."
          test -d Distributables/percy-local-manager-extension

          echo
          echo "✅ All distributables verified"

      # ------------------------------------------------------
      # Prepare release folders (Creates the exact tree structure)
      # ------------------------------------------------------
      - name: Prepare release packages
        run: |
          mkdir -p release/percy-linux
          mkdir -p release/percy-mac
          mkdir -p release/percy-windows

          # Linux
          cp -R Distributables/percy-linux/. release/percy-linux/
          cp -R Distributables/percy-local-manager-extension release/percy-linux/

          # Mac
          cp -R Distributables/percy-mac/. release/percy-mac/
          cp -R Distributables/percy-local-manager-extension release/percy-mac/

          # Windows
          cp -R Distributables/percy-windows/. release/percy-windows/
          cp -R Distributables/percy-local-manager-extension release/percy-windows/

      # ------------------------------------------------------
      # Package into ZIPs
      # ------------------------------------------------------
      - name: Package Distributables
        run: |
          cd release
          # Zipping the folders from the outside creates the root folder in the zip
          zip -r ../percy-linux.zip percy-linux
          zip -r ../percy-mac.zip percy-mac
          zip -r ../percy-windows.zip percy-windows

      # ------------------------------------------------------
      # Show ZIPs
      # ------------------------------------------------------
      - name: Show release files
        run: |
          ls -lh percy-linux.zip percy-mac.zip percy-windows.zip

      # ------------------------------------------------------
      # Create Unified Release (Fixes the "Latest" link issue)
      # ------------------------------------------------------
      - name: Create Unified Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create \
            "$REF_NAME" \
            percy-linux.zip percy-mac.zip percy-windows.zip \
            --title "Percy Local Manager $REF_NAME" \
            --notes "Percy Local Manager for Linux, macOS, and Windows."